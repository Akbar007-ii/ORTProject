# Local development only. Production deployment is described separately.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orto_dev}
      POSTGRES_DB: orto
    ports:
      - "5433:5432"
    volumes:
      - orto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orto -d orto"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  orto_pgdata:
