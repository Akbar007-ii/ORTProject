line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[lint.per-file-ignores]
"mysite/seed.py" = ["E501"]  # demo question table reads better unwrapped
"mysite/services/telegram.py" = ["E501"]  # bot texts are one line each
"mysite/services/strategy.py" = ["E501"]  # advice texts are one line each
"tests/*" = ["E501"]  # long literal rows and SQL in tests
